name: Build

# Windows x64 and macOS arm64 builds of this fork, both with the Bambu Linux bridge.
#
#   release-tag, linux-runtime -> windows-x64 (setup .exe + portable zip) \
#                                 macos-arm64 (DMG)                        -> release (pushes only)
#
# Runs on demand, for every push to main and for version tags, on GitHub-hosted runners. A manual
# run leaves the installers as artifacts of the run. A push publishes them as a GitHub release: a
# tag such as v2.5.1-bambu.1 (v<version in version.inc>[-<suffix>]) under its own name, a push to
# main under the next free v<version>-bambu.<n>, which the release creates on the pushed commit.
# The dependency builds are cached; a first run from the default branch fills the caches every
# later run (tags included) restores.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows x64 (Bambu Linux bridge; setup and portable zip)
        type: boolean
        default: true
      macos:
        description: Build macOS arm64 DMG (Bambu Linux bridge through OrbStack; ad-hoc signed)
        type: boolean
        default: true
      linux:
        description: Build the Linux runtime on its own (to try out a Linux runner)
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

# Nothing by default; every job states what it needs.
permissions: {}

# A new run replaces a running one for the same ref and the same choice of platforms. The
# choice is part of the group so that a "macOS only" run does not cancel a Windows build that
# has been going for hours (all are empty for a push). A push to main waits instead: every
# release that starts finishes, and the next one numbers its tag after it.
concurrency:
  group: build-${{ github.ref }}-win-${{ inputs.windows }}-mac-${{ inputs.macos }}-linux-${{ inputs.linux }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The name of the release a push publishes, which the installers carry: the pushed tag, or for a
  # push to main the next v<version>-bambu.<n> after the tags of that version. Empty for a manual
  # run, whose installers are named after the commit.
  release-tag:
    name: Release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          sparse-checkout: version.inc
          sparse-checkout-cone-mode: false

      - name: Name the release
        id: tag
        shell: bash
        run: |
          version=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          [ -n "$version" ] || { echo "::error::version.inc has no SoftFever_VERSION"; exit 1; }
          version_re=$(printf '%s' "$version" | sed 's/[.]/[.]/g')
          tag=
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # v2.5.1-bambu.1 on a 2.5.1 build: the tag names the release, the version the setup shows.
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "^v${version_re}(-[A-Za-z0-9.]+)?$"; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the application version $version (expected v$version or v$version-<suffix>)"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            last=$(git ls-remote --tags --refs origin "refs/tags/v${version}-bambu.*" \
              | sed -nE "s|.*refs/tags/v${version_re}-bambu[.]([0-9]+)$|\\1|p" | sort -n | tail -n 1)
            tag="v${version}-bambu.$(( ${last:-0} + 1 ))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  # The two inputs of the Windows and macOS builds that have to be made on Linux: the runtime host
  # that runs inside the WSL2 distro or OrbStack machine, and the x86-64 root filesystem it uses. All
  # of the logic is in the script, which runs the same way outside Actions.
  linux-runtime:
    name: Linux runtime (host + WSL rootfs)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows || inputs.macos || inputs.linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Build the runtime host and the WSL rootfs
        run: bash tools/slicer_linux_runtime/ci/build_linux_runtime.sh --output-dir "$RUNNER_TEMP/linux-runtime"

      - name: Upload the Linux runtime
        uses: actions/upload-artifact@v7
        with:
          name: linux-runtime
          path: ${{ runner.temp }}/linux-runtime
          if-no-files-found: error
          retention-days: 1
          # A tar and a tar.gz; deflating them again only costs time.
          compression-level: 1

  # The dependencies change rarely and take over two hours to build on a hosted runner. They
  # are a job of their own, with its own time limit, so that a cold slicer build after a cold
  # dependency build cannot run out of one shared limit. When the cache entry exists, which
  # is the usual case, the job only looks it up (about a minute).
  windows-deps:
    name: Windows dependencies
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Look for the cached dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: windows-2022-x64-msvc-orcaslicer_deps-${{ hashFiles('deps/**') }}
          lookup-only: true

      - name: Describe the runner
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/slicer_linux_runtime/ci/describe_windows_runner.ps1

      - name: Get CMake
        if: steps.deps.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Set up MSBuild
        if: steps.deps.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # OpenSSL's Configure needs a native Windows perl. The hosted images ship Strawberry
          # Perl; install it where they do not. Only perl\bin goes on PATH: Strawberry's c\bin
          # carries GNU tools the build must not pick up, and the perl of Git for Windows is an
          # MSYS one that breaks the OpenSSL build.
          $strawberry = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$strawberry\perl.exe")) {
            choco install strawberryperl -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Strawberry Perl could not be installed.' }
          }
          $env:PATH = "$strawberry;$env:PATH"
          $perlOs = & perl -e 'print $^O'
          if ($perlOs -ne 'MSWin32') { throw "The perl on PATH is '$perlOs', not a native Windows perl." }

          .\build_win.bat -d --vs 2022
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Only the install prefix is cached; the build trees and the downloads are several
          # GB. Best effort: a file a lingering compiler process still holds must not fail a
          # finished dependency build.
          Get-ChildItem deps\build -Force | Where-Object { $_.Name -ne 'OrcaSlicer_dep' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item deps\DL_CACHE -Recurse -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps.outputs.cache-primary-key }}

  windows-x64:
    name: Windows x64
    needs: [release-tag, linux-runtime, windows-deps]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    # Not upstream's windows-latest: that image carries Visual Studio 2026 and upstream builds on
    # it with clang-cl. The bridge has only ever been compiled with Visual Studio 2022's cl, so
    # this job keeps that compiler. It drives it with Ninja instead of MSBuild so that the
    # compiles can go through a compiler cache: a hosted runner needs well over two hours to
    # compile everything, and minutes when the objects come out of the cache.
    runs-on: windows-2022
    # The build step's own limit (300) plus about half an hour for packing, the setup and its test.
    timeout-minutes: 345
    permissions:
      contents: read
      # Deleting the compiler cache entries a new one supersedes.
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 4G
      # The compiler is part of an image that is rebuilt often, so its mtime means nothing.
      CCACHE_COMPILERCHECK: content
      # The precompiled header, whose macros ccache cannot see; the few files that use
      # __DATE__ or __TIME__; headers a fresh checkout has just written.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_LEG: windows-2022-x64-msvc
      NSIS_VERSION: '3.13'
      NSIS_SHA256: BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Describe the runner
        shell: pwsh
        run: ./tools/slicer_linux_runtime/ci/describe_windows_runner.ps1

      - name: Name the build
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          $content = Get-Content version.inc -Raw
          if ($content -notmatch 'set\(SoftFever_VERSION "(.*?)"\)') { throw 'version.inc has no SoftFever_VERSION' }
          $version = $Matches[1]
          if ($env:RELEASE_TAG) {
            # The release-tag job checked it: v<version>[-<suffix>]. The setup shows it without the v.
            $label = $env:RELEASE_TAG
            $setupVersion = $env:RELEASE_TAG.Substring(1)
          } else {
            $label = "V$version-$($env:GITHUB_SHA.Substring(0, 7))"
            $setupVersion = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "label=$label"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$setupVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=OrcaSlicer_BambuBridge_Windows_x64_${label}_portable.zip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "setup=OrcaSlicer_BambuBridge_Windows_x64_${label}_setup.exe"

      - name: Download the Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: linux-runtime
          path: ${{ runner.temp }}/linux-runtime

      - name: Stage the Linux runtime
        shell: pwsh
        run: ./tools/slicer_linux_runtime/ci/stage_linux_runtime.ps1 -ArtifactDir (Join-Path $env:RUNNER_TEMP 'linux-runtime')

      # CMake and Ninja.
      - name: Get CMake
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      # Built by the windows-deps job of this run, or by an earlier run.
      - name: Restore the dependencies
        uses: actions/cache/restore@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: windows-2022-x64-msvc-orcaslicer_deps-${{ hashFiles('deps/**') }}
          fail-on-cache-miss: true

      # Compiler cache for the slicer build. Every step of it may fail without failing the
      # build, which then compiles everything. A pinned ccache release: caching cl with a
      # precompiled header needs a recent one, and the version is part of what was tested.
      - name: Install the compiler cache
        id: ccache
        continue-on-error: true
        shell: pwsh
        env:
          CCACHE_VERSION: 4.14.3
          CCACHE_SHA256: c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd
          CCACHE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ccache-$env:CCACHE_VERSION-windows-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:CCACHE_SHA256) { throw "$name.zip has SHA-256 $hash, not the pinned one." }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP $name
          # Captured first: piping it into Select-Object -First 1 closes the pipe early and
          # ccache then exits with an error.
          $version = & (Join-Path $bin 'ccache.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'ccache does not start.' }
          $version | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_ENTRY=ccache-$env:CCACHE_LEG-$env:CCACHE_RUN"
          # Read by build_win.bat and handed to the slicer's configure. No debug information:
          # a compile that writes it into the PDB its target shares (/Zi) cannot be cached,
          # and kept in the objects (/Z7) it pushes libslic3r_gui.lib past the 4 GB a
          # library may have (LNK1248). The code is the same; the PDBs, which the package
          # never contained, hold public symbols only.
          Add-Content -Path $env:GITHUB_ENV -Value 'ORCA_SLICER_CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSLIC3R_MSVC_PDB=OFF'

      - name: Restore the compiler cache
        id: ccache_restore
        if: steps.ccache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ${{ env.CCACHE_ENTRY }}
          restore-keys: ccache-${{ env.CCACHE_LEG }}-

      # The step's own limit is below the job's, so that a build which runs out of time
      # still gets to save what it compiled: the next run starts from there.
      - name: Build and install OrcaSlicer
        timeout-minutes: 300
        shell: pwsh
        run: |
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache -z }
          # One compiler per logical processor. Ninja's default of two more would only add
          # memory pressure: the private-repository runner has 2 of them and 8 GB.
          .\build_win.bat -s -i -x -j $env:NUMBER_OF_PROCESSORS

      - name: Compiler cache statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          ccache --evict-older-than 7d
          ccache -s -v

      # Entries are immutable, so each run saves a new one and then drops the older ones. A
      # failed or timed-out build saves too. Only branch runs save: an entry saved by a tag
      # run can be restored by that tag alone.
      - name: Save the compiler cache
        id: ccache_save
        if: ${{ always() && steps.ccache_restore.outcome == 'success' && github.ref_type == 'branch' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ${{ env.CCACHE_ENTRY }}

      - name: Drop older compiler cache entries
        if: ${{ always() && steps.ccache_save.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The save step reports success even when its tar failed, so keep the older entries
          # unless the new one is listed.
          if ! gh cache list --ref "$GITHUB_REF" --key "$CCACHE_ENTRY" --json key \
              | jq -e --arg entry "$CCACHE_ENTRY" 'any(.[]; .key == $entry)' > /dev/null; then
            echo "$CCACHE_ENTRY was not saved; keeping the older entries."
            exit 0
          fi
          gh cache list --ref "$GITHUB_REF" --key "ccache-$CCACHE_LEG-" --limit 100 --json id,key \
            | jq -r --arg prefix "ccache-$CCACHE_LEG-" --argjson run "$GITHUB_RUN_ID" \
                '.[] | select((.key | ltrimstr($prefix) | split("-")[0] | tonumber?) < $run) | .id' \
            | tr -d '\r' \
            | while read -r id; do gh cache delete "$id"; done

      # The install step only warns when the Linux runtime is missing. Such a build starts, but
      # can never load the Bambu network plug-in, so it must not be published.
      - name: Verify the Bambu Linux bridge is in the build
        shell: pwsh
        run: >
          ./tools/slicer_linux_runtime/ci/verify_windows_package.ps1
          -InstallDir build/OrcaSlicer
          -RuntimeManifest (Join-Path $env:RUNNER_TEMP 'linux-runtime/runtime-files.sha256')
          -RequireEmptyDataDir

      - name: Pack the portable zip
        shell: pwsh
        working-directory: build
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          $zip = Join-Path (Get-Location) $env:ZIP_NAME
          # Windows' own tar (bsdtar) writes an ordinary deflate zip and keeps empty folders, so
          # nothing has to be installed for this step.
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          & $tar -a -c -f $zip OrcaSlicer
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE." }

          # The empty data_dir folder is what keeps this build's settings apart from a stock
          # OrcaSlicer; the rootfs is the bridge's largest piece.
          $entries = (& $tar -t -f $zip) | ForEach-Object { ($_ -replace '\\', '/').TrimEnd('/') }
          if ($LASTEXITCODE -ne 0) { throw "The zip cannot be read back." }
          foreach ($wanted in 'OrcaSlicer/data_dir', 'OrcaSlicer/orca-slicer.exe', 'OrcaSlicer/orca-mcp-bridge.exe',
                              'OrcaSlicer/linux_runtime/slicer_linux_runtime.dll',
                              'OrcaSlicer/linux_runtime/slicer_linux_runtime_host_abi1',
                              'OrcaSlicer/linux_runtime/windows-wsl2-rootfs.tar') {
            if ($entries -notcontains $wanted) { throw "The zip lacks $wanted" }
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          # LF, so "sha256sum -c" in the release job reads it.
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $env:ZIP_NAME`n")
          $sizeMb = [math]::Round((Get-Item -LiteralPath $zip).Length / 1MB)
          @(
            "### Windows x64"
            ""
            "``$env:ZIP_NAME`` ($sizeMb MB), SHA-256 ``$hash``"
            ""
            "Portable: unzip anywhere and run ``orca-slicer.exe``. Settings live in the ``data_dir`` folder next to it."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: |
            build/${{ steps.meta.outputs.zip }}
            build/${{ steps.meta.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # NSIS makes the setup, as upstream's: the same pinned release and checksum as upstream's
      # build_orca.yml, kept in the Actions cache so most runs never download it.
      - name: Restore NSIS
        id: nsis_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-${{ env.NSIS_VERSION }}

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisDir = Join-Path $env:RUNNER_TEMP 'nsis'
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            $zip = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION.zip"
            curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
            if ($LASTEXITCODE -ne 0) { throw "NSIS $env:NSIS_VERSION download failed." }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:NSIS_SHA256) {
              throw "NSIS $env:NSIS_VERSION archive does not match its pinned SHA-256."
            }
            Expand-Archive $zip $env:RUNNER_TEMP
            Move-Item (Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION") $nsisDir
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis does not start.' }

      - name: Save NSIS
        if: steps.nsis_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-${{ env.NSIS_VERSION }}

      # A per-user setup of the verified tree above, with data_dir kept apart as user data
      # (tools/windows_installer/OrcaSlicerBambuBridge.nsi says why).
      - name: Build the setup
        shell: pwsh
        run: >
          ./tools/windows_installer/build_installer.ps1
          -SourceDir build/OrcaSlicer
          -OutFile (Join-Path 'build' '${{ steps.meta.outputs.setup }}')
          -Version '${{ steps.meta.outputs.version }}'
          -Makensis (Join-Path $env:RUNNER_TEMP 'nsis/makensis.exe')

      # Silent install into a scratch folder, the same checks as the portable tree, an upgrade
      # over it with something in data_dir, and an uninstall that must leave only data_dir.
      - name: Test the setup
        shell: pwsh
        run: >
          ./tools/windows_installer/test_installer.ps1
          -Installer (Join-Path 'build' '${{ steps.meta.outputs.setup }}')
          -InstallDir (Join-Path $env:RUNNER_TEMP 'setup-test')
          -SourceDir build/OrcaSlicer
          -RuntimeManifest (Join-Path $env:RUNNER_TEMP 'linux-runtime/runtime-files.sha256')

      - name: Describe the setup
        shell: pwsh
        env:
          SETUP_NAME: ${{ steps.meta.outputs.setup }}
        run: |
          $setup = Join-Path 'build' $env:SETUP_NAME
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          $sizeMb = [math]::Round((Get-Item -LiteralPath $setup).Length / 1MB)
          @(
            ""
            "``$env:SETUP_NAME`` ($sizeMb MB), SHA-256 ``$hash``"
            ""
            "Setup: installs for the current user into ``%LOCALAPPDATA%\Programs\OrcaSlicer-BambuBridge`` (no administrator rights); settings in its ``data_dir`` folder, kept on upgrade and uninstall."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload the setup
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-setup
          path: |
            build/${{ steps.meta.outputs.setup }}
            build/${{ steps.meta.outputs.setup }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos-arm64:
    name: macOS arm64
    needs: [release-tag, linux-runtime]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    # The image upstream builds on; arm64 (Apple Silicon).
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
      # Deleting the compiler cache entries a new one supersedes.
      actions: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # The compiler is part of an image that is rebuilt often, so its mtime means nothing.
      CCACHE_COMPILERCHECK: content
      CCACHE_LEG: macos-15-arm64
    defaults:
      run:
        # Named explicitly, which also turns on pipefail.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Name the build
        id: meta
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          version=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          [ -n "$version" ] || { echo "version.inc has no SoftFever_VERSION"; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            # The release-tag job checked it, as for Windows.
            label="$RELEASE_TAG"
          else
            label="V${version}-${GITHUB_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "dmg=OrcaSlicer_BambuBridge_macOS_arm64_${label}.dmg" >> "$GITHUB_OUTPUT"
          [ "$(uname -m)" = "arm64" ] || { echo "this job needs an arm64 runner, got $(uname -m)"; exit 1; }

      # CMake and Ninja, as upstream.
      - name: Get CMake
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      # Restore and save are separate steps, so a dependency build is kept even when the
      # slicer build after it fails.
      - name: Restore the dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/build/arm64
          key: macos-15-arm64-orcaslicer_deps-${{ hashFiles('deps/**') }}

      - name: Build the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          brew install automake texinfo libtool pkgconf yasm nasm
          ./build_release_macos.sh -dx -j 3 -a arm64 -t 10.15
          # Only the install prefix is needed from here on (and cached).
          (cd deps/build/arm64 && find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +)
          rm -rf deps/DL_CACHE

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/build/arm64
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Install tools
        run: |
          brew install libtool
          mkdir -p deps/build/arm64

      - name: Free disk space
        run: |
          df -hI /
          # Deleting the unused Xcodes takes minutes, so only do it when the build might not fit.
          avail_gib=$(df -g / | awk 'NR == 2 { print $4 }')
          if [ "$avail_gib" -ge 15 ]; then
            echo "$avail_gib GiB free, enough for the build"
            exit 0
          fi
          xcode=$(basename "$(cd "$(xcode-select -p)/../.." && pwd -P)")
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "$xcode" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /

      # Compiler cache for the slicer build: at ten times the price of a Linux minute, a warm
      # rebuild is worth the bookkeeping. Every step of it may fail without failing the build;
      # build_release_macos.sh uses ccache when it is on PATH and builds without it otherwise.
      - name: Install the compiler cache
        id: ccache
        continue-on-error: true
        run: |
          brew install ccache
          ccache --version | head -n 1
          {
            echo "CCACHE_ENTRY=ccache-$CCACHE_LEG-${{ github.run_id }}-${{ github.run_attempt }}"
            # Read by build_release_macos.sh; the remaining ccache settings are its own.
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        id: ccache_restore
        if: steps.ccache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CCACHE_ENTRY }}
          restore-keys: ccache-${{ env.CCACHE_LEG }}-

      - name: Download the Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: linux-runtime
          path: ${{ runner.temp }}/linux-runtime

      - name: Stage the Linux runtime
        run: ./tools/slicer_linux_runtime/ci/stage_linux_runtime.sh "$RUNNER_TEMP/linux-runtime"

      - name: Build OrcaSlicer
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -z || true; fi
          ./build_release_macos.sh -s -n -x -j 3 -a arm64 -t 10.15
          # Without the package the app silently keeps Bambu's macOS plug-in.
          package="build/arm64/OrcaSlicer/OrcaSlicer.app/Contents/Resources/linux_runtime"
          for name in libslicer_linux_runtime.dylib slicer_linux_runtime_host slicer_linux_runtime_host_abi1 \
                      slicer_linux_runtime_wsl_run_host.sh install_runtime_macos.sh windows-wsl2-rootfs.tar; do
            [ -f "$package/$name" ] || { echo "::error::$package/$name is missing"; exit 1; }
          done
          [ "$(lipo -archs "$package/libslicer_linux_runtime.dylib")" = "arm64" ] \
            || { echo "::error::libslicer_linux_runtime.dylib is not arm64"; exit 1; }

      - name: Compiler cache statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          ccache --evict-older-than 7d
          ccache -s -v || ccache -s

      # Entries are immutable, so each run saves a new one and then drops the older ones. Only
      # branch runs save: an entry saved by a tag run can be restored by that tag alone.
      - name: Save the compiler cache
        id: ccache_save
        if: ${{ always() && steps.ccache_restore.outcome == 'success' && github.ref_type == 'branch' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CCACHE_ENTRY }}

      - name: Drop older compiler cache entries
        if: ${{ always() && steps.ccache_save.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The save step reports success even when its tar failed, so keep the older entries
          # unless the new one is listed.
          if ! gh cache list --ref "$GITHUB_REF" --key "$CCACHE_ENTRY" --json key \
              | jq -e --arg entry "$CCACHE_ENTRY" 'any(.[]; .key == $entry)' > /dev/null; then
            echo "$CCACHE_ENTRY was not saved; keeping the older entries."
            exit 0
          fi
          gh cache list --ref "$GITHUB_REF" --key "ccache-$CCACHE_LEG-" --limit 100 --json id,key \
            | jq -r --arg prefix "ccache-$CCACHE_LEG-" --argjson run "$GITHUB_RUN_ID" \
                '.[] | select((.key | ltrimstr($prefix) | split("-")[0] | tonumber?) < $run) | .id' \
            | while read -r id; do gh cache delete "$id"; done

      # No Apple Developer certificate: no Developer ID signature and no notarization. Apple
      # Silicon refuses to run code without any signature, so the bundle is signed ad hoc - every
      # Mach-O file first, the bundle last, as upstream's release signing does (codesign --deep
      # cannot sign the bundled Python runtime).
      - name: Sign the app ad hoc
        run: |
          app="build/arm64/OrcaSlicer/OrcaSlicer.app"
          [ -d "$app" ] || { echo "::error::$app was not built"; exit 1; }
          archs=$(lipo -archs "$app/Contents/MacOS/OrcaSlicer")
          [ "$archs" = "arm64" ] || { echo "::error::expected an arm64 executable, got: $archs"; exit 1; }

          xattr -cr "$app"
          machos=()
          while IFS= read -r f; do machos+=("$f"); done < <(
            find "$app" -type f -print0 |
              xargs -0 file --no-pad --mime-type -- |
              grep -v ' (for architecture ' |
              grep ': application/x-mach-binary$' |
              sed 's|: application/x-mach-binary$||'
          )
          if [ "${#machos[@]}" -eq 0 ]; then
            echo "::error::no Mach-O files found in $app"
            exit 1
          fi
          echo "signing ${#machos[@]} Mach-O files"
          codesign --force --sign - --timestamp=none "${machos[@]}"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The MCP stdio bridge ships inside the bundle (src/mcp_bridge); Claude Desktop runs it
          # directly, so it must be there and carry a valid signature of its own.
          bridge="$app/Contents/MacOS/orca-mcp-bridge"
          [ -x "$bridge" ] || { echo "::error::orca-mcp-bridge missing from $app"; exit 1; }
          codesign --verify --strict --verbose=2 "$bridge"
          [ "$(lipo -archs "$bridge")" = "arm64" ] || { echo "::error::orca-mcp-bridge is not arm64"; exit 1; }
          codesign --display --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Signature=adhoc$' "$RUNNER_TEMP/codesign.txt"

      - name: Create the DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg }}
        run: |
          # create_dmg calls `retry`; upstream's waits five minutes between attempts, which is
          # a lot of macOS time for hdiutil's occasional "Resource busy".
          retry() {
            local attempt=1
            until "$@"; do
              [ "$attempt" -lt 3 ] || return 1
              attempt=$((attempt + 1))
              sleep 30
            done
          }
          source scripts/create_dmg.sh

          stage="$RUNNER_TEMP/OrcaSlicer_dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R build/arm64/OrcaSlicer/OrcaSlicer.app "$stage/"
          codesign --verify --deep --strict "$stage/OrcaSlicer.app"
          ln -sfn /Applications "$stage/Applications"
          create_dmg "OrcaSlicer Bambu Bridge" "$stage" "$DMG_NAME"

          # What the user drags: the app, arm64, and the Applications link.
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$DMG_NAME" > /dev/null
          ls -la "$mount"
          [ -d "$mount/OrcaSlicer.app" ] && [ -L "$mount/Applications" ] &&
            [ "$(readlink "$mount/Applications")" = "/Applications" ] &&
            [ "$(lipo -archs "$mount/OrcaSlicer.app/Contents/MacOS/OrcaSlicer")" = "arm64" ] || {
              hdiutil detach "$mount" > /dev/null
              echo "::error::the DMG lacks OrcaSlicer.app (arm64) or the Applications link"
              exit 1
            }
          hdiutil detach "$mount" > /dev/null

          hash=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "$hash  $DMG_NAME" > "$DMG_NAME.sha256"
          size_mb=$(( $(stat -f %z "$DMG_NAME") / 1048576 ))
          {
            echo "### macOS arm64 (Apple Silicon)"
            echo
            echo "\`$DMG_NAME\` ($size_mb MB), SHA-256 \`$hash\`"
            echo
            echo "**Not signed with an Apple Developer ID and not notarized** (ad-hoc signature only)."
            echo "Gatekeeper blocks the first start of a downloaded copy. After dragging OrcaSlicer to"
            echo "Applications, clear the quarantine once (or see the release notes for the other ways):"
            echo
            echo '```'
            echo 'xattr -dr com.apple.quarantine /Applications/OrcaSlicer.app'
            echo '```'
            echo
            echo "With [OrbStack](https://orbstack.dev) installed, the Bambu Linux bridge runs Bambu's Linux network plug-in"
            echo "in an OrbStack machine; without it the app loads Bambu's macOS plug-in like stock OrcaSlicer."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: |
            ${{ steps.meta.outputs.dmg }}
            ${{ steps.meta.outputs.dmg }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # A published (not draft) release for every push, a version tag or a commit on main, with the
  # setup, the portable zip, the DMG, a .sha256 for each and the notes in .github/release_notes.md.
  # A manual run leaves its installers as artifacts of the run.
  release:
    name: Release
    if: ${{ github.event_name == 'push' && needs.release-tag.outputs.tag != '' }}
    needs: [release-tag, windows-x64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          sparse-checkout: .github
          path: src

      - name: Download the Windows setup
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-setup
          path: dist

      - name: Download the Windows portable zip
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-portable
          path: dist

      - name: Download the macOS DMG
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-dmg
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          cd dist
          ls -l
          setup=$(ls -- *_setup.exe)
          zip=$(ls -- *_portable.zip)
          dmg=$(ls -- *.dmg)
          for f in "$setup" "$zip" "$dmg"; do
            case "$f" in *"$TAG"*) ;; *) echo "::error::$f does not carry the tag $TAG"; exit 1 ;; esac
            [ -f "$f.sha256" ] || { echo "::error::$f has no .sha256"; exit 1; }
          done
          sha256sum -c -- *.sha256
          cat -- "$setup.sha256" "$zip.sha256" "$dmg.sha256" > SHA256SUMS.txt

          sed -e "s|@TAG@|$TAG|g" -e "s|@APP_VERSION@|${TAG#v}|g" -e "s|@SHA@|$GITHUB_SHA|g"               -e "s|@SETUP@|$setup|g" -e "s|@ZIP@|$zip|g" -e "s|@DMG@|$dmg|g"               ../src/.github/release_notes.md > "$RUNNER_TEMP/notes.md"
          if grep -n '@[A-Z_]*@' "$RUNNER_TEMP/notes.md"; then
            echo "::error::placeholders left in the release notes"
            exit 1
          fi

          assets=("$setup" "$setup.sha256" "$zip" "$zip.sha256" "$dmg" "$dmg.sha256" SHA256SUMS.txt)
          # A re-run of the same tag replaces the assets and the notes of the release it made.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false --title "OrcaSlicer Bambu Bridge $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              target=(--verify-tag)
            else
              # A push to main: the release creates its tag on the pushed commit. A tag made with
              # this token starts no workflow, so the commit is not built a second time.
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${assets[@]}" "${target[@]}" --latest --title "OrcaSlicer Bambu Bridge $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[] | {name, size}]}'
